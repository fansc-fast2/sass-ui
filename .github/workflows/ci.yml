# push/PR 到 main 的质量门禁：类型检查 + 产物构建（不跑冒烟——那需要后端）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查（tsc --noEmit）
        run: npx tsc --noEmit

      - name: 构建产物（vite build）
        run: npm run build
